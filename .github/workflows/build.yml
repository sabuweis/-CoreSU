name: Build CoreSU

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-lkm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract Source (LKM)
      run: |
        if ! command -v unzip >/dev/null 2>&1; then
          (apt-get update -qq && apt-get install -y -qq unzip) || (apk add --no-cache unzip) || true
        fi
        # 智能查找并解压 zip
        ZIP_FILE=$(ls *.zip | head -n 1)
        unzip -q "$ZIP_FILE"

    - name: Build kernelsu.ko
      run: |
        # 智能进入解压后的目录
        cd $(find . -maxdepth 1 -type d -name "CoreSU*" | head -n 1)/kernel
        CONFIG_KSU=m CC=clang make
        cp kernelsu.ko /tmp/${{ matrix.kmi }}_kernelsu.ko

    - name: Upload LKM
      uses: actions/upload-artifact@v4
      with:
        name: lkm-${{ matrix.kmi }}
        path: /tmp/${{ matrix.kmi }}_kernelsu.ko

  build-apk:
    needs: build-lkm
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract Source (APK)
      run: |
        ZIP_FILE=$(ls *.zip | head -n 1)
        unzip -q "$ZIP_FILE"
        DIR_NAME=$(find . -maxdepth 1 -type d -name "CoreSU*" | head -n 1)
        echo "DIR_NAME=$DIR_NAME" >> $GITHUB_ENV

    - name: Download all LKMs
      uses: actions/download-artifact@v4
      with:
        pattern: lkm-*
        path: ./all-lkm
        merge-multiple: true

    - name: Place all LKMs into ksud bin dir
      run: |
        mkdir -p ${{ env.DIR_NAME }}/userspace/ksud/bin/aarch64
        cp all-lkm/*.ko ${{ env.DIR_NAME }}/userspace/ksud/bin/aarch64/

    - name: Sync uapi headers
      run: |
        rm -rf ${{ env.DIR_NAME }}/manager/app/src/main/cpp/uapi
        cp -r ${{ env.DIR_NAME }}/uapi ${{ env.DIR_NAME }}/manager/app/src/main/cpp/uapi

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29

    - name: Build ksuinit
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      working-directory: ${{ env.DIR_NAME }}
      run: |
        source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
        BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-aarch64-android.a"
        export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
        cargo build --package ksuinit --target=aarch64-linux-android --release
        cp target/aarch64-linux-android/release/ksuinit userspace/ksud/bin/aarch64/

    - name: Build ksud
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      working-directory: ${{ env.DIR_NAME }}
      run: |
        source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
        cargo build --target aarch64-linux-android --release --manifest-path ./userspace/ksud/Cargo.toml

    - name: Place ksud into APK
      working-directory: ${{ env.DIR_NAME }}
      run: |
        KSUD=target/aarch64-linux-android/release/ksud
        mkdir -p manager/app/src/main/jniLibs/arm64-v8a
        cp "$KSUD" manager/app/src/main/jniLibs/arm64-v8a/libksud.so

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        test -n "$KEYSTORE_BASE64" || { echo "empty"; exit 1; }
        echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/mykey.jks"
        test -s "$GITHUB_WORKSPACE/mykey.jks" || { echo "empty"; exit 1; }

    - name: Build APK
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/mykey.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      working-directory: ${{ env.DIR_NAME }}/manager
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleRelease \
          -PKEYSTORE_FILE="$KEYSTORE_FILE" \
          -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
          -PKEY_ALIAS="$KEY_ALIAS" \
          -PKEY_PASSWORD="$KEY_PASSWORD" \
          -PKSU_NAME=CoreSU \
          -PKSU_PACKAGE_NAME=me.li.coresu

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CoreSU-Manager-APK
        path: ${{ env.DIR_NAME }}/manager/app/build/outputs/apk/release/*.apk
        if-no-files-found: warn
